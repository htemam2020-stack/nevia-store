<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Névia | Women's Bags</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #faf8f6;
      color: #222;
    }

    /* HEADER */
    header {
      background: #fff;
      height: 75px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 7%;
      box-shadow: 0 2px 15px rgba(0,0,0,0.05);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 30px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #222;
    }

    nav a {
      text-decoration: none;
      color: #333;
      margin-right: 25px;
      font-size: 15px;
    }

    nav a:hover {
      color: #9b6b5a;
    }

    /* HERO */
    .hero {
      min-height: 550px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 60px 8%;
      background: linear-gradient(120deg, #f4ebe7, #fff);
    }

    .hero-text {
      max-width: 500px;
    }

    .hero-text small {
      color: #9b6b5a;
      font-size: 16px;
    }

    .hero-text h1 {
      font-size: 60px;
      margin: 15px 0;
      letter-spacing: 3px;
    }

    .hero-text p {
      color: #666;
      line-height: 1.8;
      font-size: 17px;
      margin-bottom: 25px;
    }

    .btn {
      display: inline-block;
      background: #222;
      color: white;
      text-decoration: none;
      padding: 14px 30px;
      border-radius: 30px;
      transition: 0.3s;
    }

    .btn:hover {
      background: #9b6b5a;
    }

    .hero-image {
      width: 45%;
      max-width: 500px;
      border-radius: 20px;
      object-fit: cover;
    }

    /* PRODUCTS */
    .products {
      padding: 70px 7%;
    }

    .section-title {
      text-align: center;
      margin-bottom: 45px;
    }

    .section-title h2 {
      font-size: 35px;
      margin-bottom: 10px;
    }

    .section-title p {
      color: #777;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }

    .product {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 5px 25px rgba(0,0,0,0.06);
      transition: 0.3s;
    }

    .product:hover {
      transform: translateY(-7px);
    }

    .product img {
      width: 100%;
      height: 330px;
      object-fit: cover;
    }

    .product-info {
      padding: 20px;
      text-align: center;
    }

    .product-info h3 {
      margin-bottom: 10px;
    }

    .price {
      color: #9b6b5a;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .order-btn {
      display: block;
      background: #222;
      color: white;
      text-decoration: none;
      padding: 11px;
      border-radius: 25px;
    }

    .order-btn:hover {
      background: #9b6b5a;
    }

    /* ABOUT */
    .about {
      background: #222;
      color: white;
      text-align: center;
      padding: 70px 10%;
    }

    .about h2 {
      font-size: 35px;
      margin-bottom: 20px;
    }

    .about p {
      max-width: 650px;
      margin: auto;
      line-height: 2;
      color: #ddd;
    }

    /* FOOTER */
    footer {
      background: #111;
      color: #aaa;
      text-align: center;
      padding: 25px;
    }

    /* MOBILE */
    @media (max-width: 768px) {

      header {
        padding: 0 5%;
      }

      .logo {
        font-size: 25px;
      }

      nav a {
        margin-right: 10px;
        font-size: 12px;
      }

      .hero {
        flex-direction: column;
        text-align: center;
        padding: 50px 6%;
      }

      .hero-text h1 {
        font-size: 48px;
      }

      .hero-image {
        width: 100%;
        margin-top: 35px;
      }

      .product-grid {
        grid-template-columns: 1fr;
      }

      .product img {
        height: 380px;
      }
    }
  </style>
</head>

<body>
