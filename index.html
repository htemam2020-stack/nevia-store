<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Névia | Bags & Accessories</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff9f7;
            color: #3d2928;
        }

        header {
            background: #fff;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eadbd7;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-family: Georgia, serif;
            font-size: 30px;
            color: #4b302f;
            font-weight: bold;
        }

        nav a {
            text-decoration: none;
            color: #5d4543;
            margin: 0 10px;
            font-size: 15px;
        }

        .cart {
            background: #d8a39a;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 20px;
            cursor: pointer;
        }

        .hero {
            min-height: 500px;
            padding: 70px 8%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
            background: linear-gradient(135deg, #f9e9e5, #fffaf8);
        }

        .hero-text {
            max-width: 520px;
        }

        .hero h1 {
            font-family: Georgia, serif;
            font-size: 64px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 19px;
            color: #765e5a;
            line-height: 1.8;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            background: #4b302f;
            color: white;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 25px;
            cursor: pointer;
            border: none;
        }

        .hero-bag {
            font-size: 170px;
        }

        .section {
            padding: 60px 7%;
        }

        .section-title {
            text-align: center;
            margin-bottom: 35px;
        }

        .section-title h2 {
            font-family: Georgia, serif;
            font-size: 36px;
            margin-bottom: 8px;
        }

        .section-title p {
            color: #8a706b;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 22px;
        }

        .product {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(80,40,30,.08);
            transition: .3s;
        }

        .product:hover {
            transform: translateY(-5px);
        }

        .product-image {
            height: 250px;
            background: #f4e7e3;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 100px;
        }

        .product-info {
            padding: 18px;
        }

        .product-info h3 {
            margin-bottom: 8px;
        }

        .price {
            color: #b7796d;
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .add {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 10px;
            background: #4b302f;
            color: white;
            cursor: pointer;
        }

        .about {
            background: #f4e7e
